<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "FitBuddy" }}</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
<a class="brand" href="/">FitBuddy<span>AI</span></a>
<nav><a href="/">Home</a><a href="/view-all-users">Users</a><a href="/docs">API Docs</a></nav>
</header>
<main class="page">
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
{% if message %}<div class="alert success">{{ message }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<footer>FitBuddy • Student Generative AI Project</footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
